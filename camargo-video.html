        /* ===================================================== */
        /* ВИПРАВЛЕНИЙ СТИЛЬ ДЛЯ ВІДЕО-КОНТЕЙНЕРА BUNNY.NET     */
        /* ===================================================== */

        /* Обгортка для обмеження максимальної ширини */
        .video-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 5%; /* Відступи на мобільних */
        }

        /* Контейнер з aspect-ratio trick (замість padding-top %) */
        .video-container {
            position: relative;
            width: 100%;
            /* Сучасний спосіб зберегти 16:9 — підтримується всіма браузерами з 2021 */
            aspect-ratio: 16 / 9;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            background: #000;
            overflow: hidden;
        }

        /* iframe займає весь контейнер */
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block; /* прибирає зайвий inline-відступ */
        }

        /* Адаптивність */
        @media (max-width: 1100px) {
            .video-wrapper {
                max-width: 90%;
                padding: 0;
            }
        }

        @media (max-width: 768px) {
            .video-wrapper {
                max-width: 100%;
                padding: 0 3%;
                margin: 20px auto;
            }

            .video-container {
                border-width: 3px;
                border-radius: 5px;
            }
        }

        @media (max-width: 480px) {
            .video-wrapper {
                padding: 0;
            }

            .video-container {
                border-radius: 0; /* На маленьких екранах — край в край */
                border-left: none;
                border-right: none;
            }
        }

        /* Кнопка повноекранного режиму — підказка для iOS Safari */
        /* (iOS дозволяє fullscreen тільки через атрибут playsinline у <video>,
            для iframe Bunny.net це контролюється на їхньому боці через allowfullscreen) */
    </style>
